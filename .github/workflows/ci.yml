# CI workflow — 對應 tasks.md T008 與憲法 §Development Workflow 的合併閘門：
#   - OpenAPI 3.2 規格 lint 通過
#
# CodeQL 分析由獨立 workflow（codeql.yml）負責。

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openapi-lint:
    name: OpenAPI 3.2 lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:openapi
