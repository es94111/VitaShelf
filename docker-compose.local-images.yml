name: vitashelf-local-images

services:
  # ── VitaShelf (本機建置的合體 image) ──────────────────────────────────────────
  # 建置指令：docker build -t vitashelf:local .
  vitashelf:
    image: vitashelf:local
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL:  ${DATABASE_URL:-file:/app/data/vitashelf.db}
      JWT_SECRET:    ${JWT_SECRET:-change-me-to-a-very-long-random-secret-32-plus}
      NODE_ENV:      production
      API_PORT:      "4001"
      CORS_ORIGIN:   ${CORS_ORIGIN:-http://localhost}
      UPLOAD_DIR:    /app/uploads
    volumes:
      - uploads_data:/app/uploads
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sqlite_data:
  uploads_data:
