name: vitashelf-prod

services:
  # ── VitaShelf (Frontend + Backend in one image) ──────────────────────────────
  vitashelf:
    image: ${DOCKERHUB_USERNAME}/vitashelf:${IMAGE_TAG:-latest}
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL:     ${DATABASE_URL:-file:/app/data/vitashelf.db}
      JWT_SECRET:       ${JWT_SECRET}
      NODE_ENV:         production
      API_PORT:         "4001"
      CORS_ORIGIN:      ${CORS_ORIGIN:-http://localhost}
      UPLOAD_DIR:       /app/uploads
      WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN}
    volumes:
      - uploads_data:/app/uploads
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Watchtower (on-demand Docker image update trigger) ───────────────────────
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN}
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
    command: --http-api-update --label-enable
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  sqlite_data:
  uploads_data:
