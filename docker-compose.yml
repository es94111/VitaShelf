name: vitashelf

services:
  # ── Frontend (dev: Vite HMR) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: builder          # Use build stage for dev (Vite dev server)
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    depends_on:
      - backend

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: builder
    command: npm run dev
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
      - sqlite_data:/app/data
    environment:
      DATABASE_URL: file:/app/data/vitashelf.db
      JWT_SECRET: dev-secret-change-in-production
      NODE_ENV: development
      PORT: "4000"
      CORS_ORIGIN: http://localhost:3000

volumes:
  sqlite_data:
  uploads_data:
